<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Cheng Shuang 後台管理</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{background:#FDF6EC;font-family:'Noto Sans TC',sans-serif;color:#3D1F0A;min-height:100vh;}

/* 登入畫面 */
#loginScreen{display:flex;align-items:center;justify-content:center;min-height:100vh;}
.login-box{background:#fff;border:1px solid #C07830;border-radius:16px;padding:2rem;width:320px;box-shadow:0 4px 20px rgba(61,31,10,0.1);}
.login-box h2{font-size:18px;color:#B8401A;margin-bottom:1.5rem;text-align:center;}
.login-box input{width:100%;border:1px solid #C07830;border-radius:8px;padding:0.7rem 1rem;font-size:14px;font-family:'Noto Sans TC',sans-serif;margin-bottom:0.8rem;background:#FDF6EC;}
.login-box button{width:100%;background:#B8401A;color:#fff;border:none;border-radius:50px;padding:0.75rem;font-size:14px;font-weight:700;font-family:'Noto Sans TC',sans-serif;cursor:pointer;}
.login-box button:active{background:#7A2510;}
.login-error{color:#E57373;font-size:12px;text-align:center;margin-top:0.5rem;}

/* 後台主體 */
#adminPanel{display:none;}
.topbar{background:#B8401A;color:#fff;padding:0.9rem 1.5rem;display:flex;align-items:center;justify-content:space-between;}
.topbar h1{font-size:16px;font-weight:700;}
.logout-btn{background:rgba(255,255,255,0.2);border:none;color:#fff;border-radius:20px;padding:0.4rem 1rem;font-size:12px;cursor:pointer;font-family:'Noto Sans TC',sans-serif;}

.tabs{display:flex;background:#fff;border-bottom:2px solid #EDD8B0;}
.tab-btn{flex:1;padding:0.8rem;font-size:13px;font-weight:700;border:none;background:none;cursor:pointer;font-family:'Noto Sans TC',sans-serif;color:#A0622A;}
.tab-btn.active{color:#B8401A;border-bottom:3px solid #B8401A;}

.panel{display:none;padding:1rem 1.2rem;}
.panel.active{display:block;}

/* 商品區 */
.sec-title{font-size:14px;font-weight:700;color:#B8401A;margin-bottom:1rem;}
.add-btn{background:#B8401A;color:#fff;border:none;border-radius:50px;padding:0.55rem 1.2rem;font-size:13px;font-weight:700;font-family:'Noto Sans TC',sans-serif;cursor:pointer;margin-bottom:1rem;}

.product-card{background:#fff;border:1px solid #EDD8B0;border-radius:12px;padding:1rem;margin-bottom:0.8rem;}
.product-card h3{font-size:14px;font-weight:700;color:#3D1F0A;}
.product-card p{font-size:12px;color:#A0622A;margin-top:0.2rem;}
.card-actions{display:flex;gap:8px;margin-top:0.8rem;}
.edit-btn{background:#F0D0C0;color:#7A4A20;border:none;border-radius:20px;padding:0.35rem 0.9rem;font-size:12px;cursor:pointer;font-family:'Noto Sans TC',sans-serif;}
.del-btn{background:#FFEBEE;color:#E57373;border:none;border-radius:20px;padding:0.35rem 0.9rem;font-size:12px;cursor:pointer;font-family:'Noto Sans TC',sans-serif;}
.status-badge{display:inline-block;border-radius:20px;padding:0.2rem 0.6rem;font-size:10px;margin-left:0.5rem;}
.active-badge{background:#E8F5E9;color:#4CAF50;}
.inactive-badge{background:#FFEBEE;color:#E57373;}

/* 表單 */
.modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:100;align-items:flex-end;justify-content:center;}
.modal-bg.open{display:flex;}
.modal{background:#FDF6EC;border-radius:16px 16px 0 0;padding:1.5rem 1.2rem;width:100%;max-width:500px;max-height:90vh;overflow-y:auto;}
.modal h3{font-size:15px;font-weight:700;color:#B8401A;margin-bottom:1rem;}
.form-group{margin-bottom:0.8rem;}
.form-group label{font-size:12px;font-weight:700;color:#7A4A20;display:block;margin-bottom:0.3rem;}
.form-group input,.form-group textarea,.form-group select{width:100%;border:1px solid #C07830;border-radius:8px;padding:0.6rem 0.8rem;font-size:13px;font-family:'Noto Sans TC',sans-serif;background:#fff;}
.form-group textarea{height:80px;resize:none;}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.modal-actions{display:flex;gap:8px;margin-top:1rem;}
.save-btn{flex:1;background:#B8401A;color:#fff;border:none;border-radius:50px;padding:0.7rem;font-size:14px;font-weight:700;font-family:'Noto Sans TC',sans-serif;cursor:pointer;}
.cancel-btn{background:#F0D0C0;color:#7A4A20;border:none;border-radius:50px;padding:0.7rem 1.2rem;font-size:14px;font-family:'Noto Sans TC',sans-serif;cursor:pointer;}

/* 客戶區 */
.customer-card{background:#fff;border:1px solid #EDD8B0;border-radius:12px;padding:1rem;margin-bottom:0.8rem;}
.customer-card h3{font-size:14px;font-weight:700;color:#3D1F0A;}
.customer-card p{font-size:12px;color:#A0622A;margin-top:0.3rem;line-height:1.6;}
.customer-date{font-size:10px;color:#C07830;margin-top:0.4rem;}

.empty-state{text-align:center;padding:2rem;color:#A0622A;font-size:13px;}
.loading{text-align:center;padding:1rem;color:#A0622A;}
</style>
</head>
<body>

<!-- 登入畫面 -->
<div id="loginScreen">
  <div class="login-box">
    <h2>🔒 Cheng Shuang 後台</h2>
    <input type="password" id="adminPwd" placeholder="請輸入管理密碼" onkeydown="if(event.key==='Enter')login()">
    <button onclick="login()">登入</button>
    <p class="login-error" id="loginError"></p>
  </div>
</div>

<!-- 後台主體 -->
<div id="adminPanel">
  <div class="topbar">
    <h1>⚙️ Cheng Shuang 後台</h1>
    <button class="logout-btn" onclick="logout()">登出</button>
  </div>

  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab('products')">📦 商品管理</button>
    <button class="tab-btn" onclick="switchTab('customers')">👥 客戶資料</button>
  </div>

  <!-- 商品管理 -->
  <div class="panel active" id="productsPanel">
    <p class="sec-title" style="margin-top:1rem;">商品列表</p>
    <button class="add-btn" onclick="openModal()">＋ 新增商品</button>
    <div id="productList"><p class="loading">載入中...</p></div>
  </div>

  <!-- 客戶資料 -->
  <div class="panel" id="customersPanel">
    <p class="sec-title" style="margin-top:1rem;">客戶詢問記錄</p>
    <div id="customerList"><p class="loading">載入中...</p></div>
  </div>
</div>

<!-- 商品表單 Modal -->
<div class="modal-bg" id="productModal">
  <div class="modal">
    <h3 id="modalTitle">新增商品</h3>
    <input type="hidden" id="editId">
    <div class="form-group">
      <label>商品名稱</label>
      <input type="text" id="fName" placeholder="例：注音符號手寫板">
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>售價（單一款）</label>
        <input type="number" id="fPriceSmall" placeholder="例：1050">
      </div>
      <div class="form-group">
        <label>大款售價（選填）</label>
        <input type="number" id="fPriceLarge" placeholder="例：1180">
      </div>
    </div>
    <div class="form-group">
      <label>商品介紹</label>
      <textarea id="fDesc" placeholder="簡短描述商品特色..."></textarea>
    </div>
    <div class="form-group">
      <label>購買連結</label>
      <input type="text" id="fUrl" placeholder="https://...">
    </div>
    <div class="form-group">
      <label>商品照片網址（選填）</label>
      <input type="text" id="fImg" placeholder="https://...">
    </div>
    <div class="form-group">
      <label>狀態</label>
      <select id="fActive">
        <option value="true">上架中</option>
        <option value="false">已下架</option>
      </select>
    </div>
    <div class="modal-actions">
      <button class="cancel-btn" onclick="closeModal()">取消</button>
      <button class="save-btn" onclick="saveProduct()">儲存</button>
    </div>
  </div>
</div>

<script>
const SUPABASE_URL = 'https://sqntwdmwpklppvypjcyp.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNxbnR3ZG13cGtscHB2eXBqY3lwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk5MDY3NjIsImV4cCI6MjA5NTQ4Mjc2Mn0.m1-ZcTvwTSzGfOxqDeoYe-xBKJWDG8S9qkMDfZR2ucs';
const ADMIN_PASSWORD = 'chengshuang2025';

const { createClient } = supabase;
const db = createClient(SUPABASE_URL, SUPABASE_KEY);

// 登入
function login() {
  const pwd = document.getElementById('adminPwd').value;
  if (pwd === ADMIN_PASSWORD) {
    document.getElementById('loginScreen').style.display = 'none';
    document.getElementById('adminPanel').style.display = 'block';
    loadProducts();
  } else {
    document.getElementById('loginError').textContent = '密碼錯誤，請再試一次';
  }
}

function logout() {
  document.getElementById('loginScreen').style.display = 'flex';
  document.getElementById('adminPanel').style.display = 'none';
  document.getElementById('adminPwd').value = '';
}

// 切換分頁
function switchTab(tab) {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
  if (tab === 'products') {
    document.querySelectorAll('.tab-btn')[0].classList.add('active');
    document.getElementById('productsPanel').classList.add('active');
    loadProducts();
  } else {
    document.querySelectorAll('.tab-btn')[1].classList.add('active');
    document.getElementById('customersPanel').classList.add('active');
    loadCustomers();
  }
}

// 商品
async function loadProducts() {
  const { data, error } = await db.from('products').select('*').order('created_at', { ascending: false });
  const el = document.getElementById('productList');
  if (error) { el.innerHTML = '<p class="empty-state">載入失敗：' + error.message + '</p>'; return; }
  if (!data.length) { el.innerHTML = '<p class="empty-state">還沒有商品，點上方「新增商品」開始！</p>'; return; }
  el.innerHTML = data.map(p => `
    <div class="product-card">
      <h3>${p.name}<span class="status-badge ${p.is_active ? 'active-badge' : 'inactive-badge'}">${p.is_active ? '上架中' : '已下架'}</span></h3>
      <p>售價：${p.price_small ? '$' + p.price_small : '—'}${p.price_large ? ' / 大款 $' + p.price_large : ''}</p>
      ${p.description ? '<p>' + p.description.substring(0,40) + '...</p>' : ''}
      <div class="card-actions">
        <button class="edit-btn" onclick='editProduct(${JSON.stringify(p)})'>編輯</button>
        <button class="del-btn" onclick="deleteProduct('${p.id}')">刪除</button>
      </div>
    </div>`).join('');
}

function openModal(p) {
  document.getElementById('modalTitle').textContent = p ? '編輯商品' : '新增商品';
  document.getElementById('editId').value = p ? p.id : '';
  document.getElementById('fName').value = p ? p.name : '';
  document.getElementById('fPriceSmall').value = p ? (p.price_small || '') : '';
  document.getElementById('fPriceLarge').value = p ? (p.price_large || '') : '';
  document.getElementById('fDesc').value = p ? (p.description || '') : '';
  document.getElementById('fUrl').value = p ? (p.buy_url || '') : '';
  document.getElementById('fImg').value = p ? (p.image_url || '') : '';
  document.getElementById('fActive').value = p ? String(p.is_active) : 'true';
  document.getElementById('productModal').classList.add('open');
}

function editProduct(p) { openModal(p); }
function closeModal() { document.getElementById('productModal').classList.remove('open'); }

async function saveProduct() {
  const id = document.getElementById('editId').value;
  const data = {
    name: document.getElementById('fName').value,
    price_small: document.getElementById('fPriceSmall').value || null,
    price_large: document.getElementById('fPriceLarge').value || null,
    description: document.getElementById('fDesc').value,
    buy_url: document.getElementById('fUrl').value,
    image_url: document.getElementById('fImg').value,
    is_active: document.getElementById('fActive').value === 'true'
  };
  if (!data.name) { alert('請填入商品名稱'); return; }
  if (id) {
    await db.from('products').update(data).eq('id', id);
  } else {
    await db.from('products').insert(data);
  }
  closeModal();
  loadProducts();
}

async function deleteProduct(id) {
  if (!confirm('確定要刪除這個商品？')) return;
  await db.from('products').delete().eq('id', id);
  loadProducts();
}

// 客戶
async function loadCustomers() {
  const { data, error } = await db.from('customers').select('*').order('created_at', { ascending: false });
  const el = document.getElementById('customerList');
  if (error) { el.innerHTML = '<p class="empty-state">載入失敗</p>'; return; }
  if (!data.length) { el.innerHTML = '<p class="empty-state">還沒有客戶詢問記錄</p>'; return; }
  el.innerHTML = data.map(c => `
    <div class="customer-card">
      <h3>${c.name || '匿名'}</h3>
      <p>📧 ${c.email || '—'}&nbsp;&nbsp;📞 ${c.phone || '—'}</p>
      ${c.product_interest ? '<p>有興趣：' + c.product_interest + '</p>' : ''}
      ${c.message ? '<p>留言：' + c.message + '</p>' : ''}
      <p class="customer-date">${new Date(c.created_at).toLocaleString('zh-TW')}</p>
    </div>`).join('');
}
</script>
</body>
</html>
