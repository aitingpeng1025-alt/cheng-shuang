<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>訂單已送出 — Cheng Shuang</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{background:#FDF6EC;font-family:'Noto Sans TC',sans-serif;color:#3D1F0A;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:1.5rem;}
.box{text-align:center;max-width:360px;width:100%;}
.icon{font-size:56px;margin-bottom:1rem;}
h1{font-size:20px;font-weight:700;color:#B8401A;margin-bottom:0.7rem;}
.lead{font-size:13px;color:#7A4A20;line-height:1.9;margin-bottom:1.2rem;}
.panel{background:#fff;border:1px solid #EDD8B0;border-radius:12px;padding:1rem;text-align:left;margin-bottom:1.4rem;}
.panel h2{font-size:12px;font-weight:700;color:#B8401A;letter-spacing:1px;margin-bottom:0.6rem;}
.panel li{font-size:12px;color:#7A4A20;line-height:1.9;margin-left:1.1rem;}
.btn-row{display:flex;gap:8px;}
.btn{flex:1;border-radius:50px;padding:0.75rem 1rem;font-size:13px;font-weight:700;text-decoration:none;display:inline-block;}
.btn-primary{background:#B8401A;color:#fff;}
.btn-ghost{background:transparent;border:1px solid #B8401A;color:#B8401A;}
</style>
</head>
<body>
<div class="box">
  <div class="icon">📦</div>
  <h1>訂單已送出</h1>
  <p class="lead">
    感謝您購買 Cheng Shuang 教材<br>
    收件資料已隨訂單一併送出
  </p>

  <div class="panel">
    <h2>接下來</h2>
    <ul>
      <li>若您選擇信用卡付款，款項已完成扣款</li>
      <li>若您選擇 ATM 或超商代碼繳費，請依綠界提供的繳費資訊於期限內完成付款</li>
      <li>款項確認後我們會盡快為您備貨寄出</li>
      <li>如需修改收件資料，請直接 IG 私訊我們</li>
    </ul>
  </div>

  <div class="btn-row">
    <a class="btn btn-ghost" href="https://www.instagram.com/cheng.shuang1025" target="_blank" rel="noopener">IG 私訊</a>
    <a class="btn btn-primary" href="/">回到首頁</a>
  </div>
</div>
</body>
</html>
