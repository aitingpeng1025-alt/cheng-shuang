<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>注音投籃小遊戲</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{--brown:#6b5540;--light-brown:#a39179;--cream:#F7F4EF;--accent:#c4673a;--correct:#4CAF50;--wrong:#e05555;}
body{font-family:'Noto Sans TC',sans-serif;background:var(--cream);min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:1rem 1rem 3rem;overflow-x:hidden;}
.court-bg{position:fixed;inset:0;background:linear-gradient(170deg,#f5ede0 0%,#ede4d5 60%,#e0d5c5 100%);z-index:0;}
.game-wrap{position:relative;z-index:1;width:100%;max-width:400px;}
.header{text-align:center;padding:0.8rem 0 0.4rem;}
.header h1{font-size:22px;font-weight:900;color:var(--brown);letter-spacing:2px;}
.header .sub{font-size:11px;color:var(--light-brown);margin-top:2px;}
.round-bar{display:flex;align-items:center;justify-content:center;gap:8px;margin:0.5rem 0;}
.round-dot{width:10px;height:10px;border-radius:50%;background:#d4c9b5;transition:all 0.3s;}
.round-dot.active{background:var(--accent);transform:scale(1.3);}
.round-dot.done{background:var(--brown);}
.round-label{font-size:12px;color:var(--light-brown);font-weight:700;letter-spacing:1px;}
.score-row{display:flex;justify-content:center;gap:14px;margin-bottom:0.5rem;}
.score-box{background:white;border:1.5px solid #d4c9b5;border-radius:12px;padding:4px 14px;text-align:center;min-width:80px;}
.score-box .lbl{font-size:9px;color:var(--light-brown);letter-spacing:1px;}
.score-box .val{font-size:20px;font-weight:900;color:var(--brown);line-height:1.2;}
.progress-wrap{width:100%;height:6px;background:#d4c9b5;border-radius:4px;margin-bottom:0.8rem;overflow:hidden;}
.progress-fill{height:100%;background:var(--accent);border-radius:4px;transition:width 0.4s ease;}
.hoop-area{display:flex;justify-content:center;margin:0 0 0.5rem;height:48px;pointer-events:none;}
.hoop{position:relative;width:80px;}
.hoop-board{position:absolute;top:0;right:-8px;width:26px;height:20px;background:white;border:2px solid #b0a898;border-radius:2px;}
.hoop-rim{position:absolute;top:20px;left:50%;transform:translateX(-50%);width:44px;height:8px;border:3px solid var(--accent);border-radius:50%;background:transparent;transition:background 0.15s;}
.hoop-net{position:absolute;top:26px;left:50%;transform:translateX(-50%);width:36px;height:18px;border:1.5px solid #d4c9b5;border-top:none;border-radius:0 0 50% 50%;}
.question-card{background:white;border-radius:20px;border:1.5px solid #e5ddd0;box-shadow:0 4px 20px rgba(107,85,64,0.08);padding:1.2rem;text-align:center;}
.question-num{font-size:10px;color:var(--light-brown);letter-spacing:2px;margin-bottom:0.6rem;font-weight:700;}
.icon-container{width:130px;height:130px;margin:0 auto 0.8rem;border-radius:50%;background:#ffffff;border:2.5px solid #d4c9b5;display:flex;align-items:center;justify-content:center;overflow:hidden;}
.icon-container img{width:75%;height:75%;object-fit:contain;display:block;}
.choices-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:0.5rem;}
.choice-btn{background:var(--cream);border:1.5px solid #d4c9b5;border-radius:12px;padding:0.65rem;font-size:15px;font-weight:700;font-family:'Noto Sans TC',sans-serif;color:var(--brown);cursor:pointer;transition:all 0.15s;letter-spacing:1px;line-height:1.3;}
.choice-btn:hover{background:#ede8e0;border-color:var(--light-brown);}
.choice-btn.correct{background:#e8f5e9;border-color:var(--correct);color:var(--correct);}
.choice-btn.wrong{background:#ffebee;border-color:var(--wrong);color:var(--wrong);}
.feedback{font-size:13px;font-weight:700;text-align:center;min-height:20px;margin-top:0.5rem;}
.feedback.correct{color:var(--correct);}
.feedback.wrong{color:var(--wrong);}
@keyframes shake{0%,100%{transform:translateX(0);}25%{transform:translateX(-6px);}75%{transform:translateX(6px);}}
@keyframes pulse{0%{transform:scale(1);}50%{transform:scale(1.08);}100%{transform:scale(1);}}
.shake{animation:shake 0.4s ease;}
.pulse{animation:pulse 0.3s ease;}
.overlay{position:fixed;inset:0;background:rgba(107,85,64,0.72);z-index:100;display:none;align-items:center;justify-content:center;backdrop-filter:blur(4px);}
.overlay.show{display:flex;}
.modal-card{background:white;border-radius:24px;padding:2rem;text-align:center;max-width:290px;width:90%;animation:popIn 0.4s cubic-bezier(0.34,1.56,0.64,1);}
@keyframes popIn{from{transform:scale(0.7);opacity:0;}to{transform:scale(1);opacity:1;}}
.big-e{font-size:48px;margin-bottom:0.5rem;}
.modal-card h2{font-size:20px;font-weight:900;color:var(--brown);margin-bottom:0.3rem;}
.modal-card p{font-size:13px;color:var(--light-brown);margin-bottom:1rem;}
.modal-btn{background:var(--brown);color:white;border:none;border-radius:50px;padding:0.7rem 2rem;font-size:14px;font-weight:700;font-family:'Noto Sans TC',sans-serif;cursor:pointer;width:100%;}
.modal-btn.accent{background:var(--accent);}
.stars{font-size:30px;letter-spacing:4px;margin:0.4rem 0;}
.final-score{font-size:42px;font-weight:900;color:var(--accent);}
.flying-ball{position:fixed;width:60px;height:60px;border-radius:50%;overflow:hidden;pointer-events:none;z-index:200;display:none;}
.flying-ball img{width:100%;height:100%;object-fit:cover;}
@keyframes fly{0%{transform:translate(0,0) scale(1) rotate(0deg);opacity:1;}45%{transform:translate(var(--tx-mid),var(--ty-mid)) scale(0.7) rotate(200deg);opacity:1;}85%{transform:translate(var(--tx),var(--ty)) scale(0.5) rotate(370deg);opacity:0.9;}100%{transform:translate(var(--tx),var(--ty)) scale(0.1) rotate(500deg);opacity:0;}}
</style>
</head>

let round=0,qInRound=0,correct=0,score=0,busy=false;
function shuffle(a){const r=[...a];for(let i=r.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[r[i],r[j]]=[r[j],r[i]];}return r;}
function loadQ(){busy=false;const q=QS[round*5+qInRound];document.getElementById('qNum').textContent='第 '+(qInRound+1)+' 題 / 共 5 題';document.getElementById('progFill').style.width=(qInRound/5*100)+'%';document.getElementById('iconImg').src=q.img;document.getElementById('iconBox').className='icon-container';const opts=shuffle([q.a,...q.w]);for(let i=0;i<4;i++){const b=document.getElementById('b'+i);b.textContent=opts[i];b.dataset.v=opts[i];b.className='choice-btn';b.disabled=false;}document.getElementById('fb').textContent='';document.getElementById('fb').className='feedback';}
function pick(i){if(busy)return;busy=true;const q=QS[round*5+qInRound];const btn=document.getElementById('b'+i);const v=btn.dataset.v;for(let j=0;j<4;j++)document.getElementById('b'+j).disabled=true;if(v===q.a){correct++;score+=10;document.getElementById('correctCnt').textContent=correct;document.getElementById('scoreCnt').textContent=score;btn.className='choice-btn correct';document.getElementById('fb').textContent='正確！🎉 投籃！';document.getElementById('fb').className='feedback correct';document.getElementById('iconBox').classList.add('pulse');setTimeout(()=>shootBall(),300);}else{btn.className='choice-btn wrong';for(let j=0;j<4;j++){if(document.getElementById('b'+j).dataset.v===q.a)document.getElementById('b'+j).className='choice-btn correct';}document.getElementById('fb').textContent='答錯囉！正確是：'+q.a;document.getElementById('fb').className='feedback wrong';document.getElementById('iconBox').classList.add('shake');setTimeout(()=>advance(),1800);}}
function shootBall(){const ir=document.getElementById('iconBox').getBoundingClientRect();const hr=document.getElementById('hoopRim').getBoundingClientRect();const flyEl=document.getElementById('flyBall');const sx=ir.left+ir.width/2-30,sy=ir.top+ir.height/2-30;const ex=hr.left+hr.width/2-30,ey=hr.top+hr.height/2-30;const dx=ex-sx,dy=ey-sy;flyEl.style.left=sx+'px';flyEl.style.top=sy+'px';flyEl.style.setProperty('--tx-mid',(dx/2)+'px');flyEl.style.setProperty('--ty-mid',(dy/2-100)+'px');flyEl.style.setProperty('--tx',dx+'px');flyEl.style.setProperty('--ty',dy+'px');flyEl.style.display='block';flyEl.style.animation='none';void flyEl.offsetWidth;flyEl.style.animation='fly 0.85s cubic-bezier(0.25,0.46,0.45,0.94) forwards';setTimeout(()=>{document.getElementById('hoopRim').style.background='rgba(196,103,58,0.35)';setTimeout(()=>document.getElementById('hoopRim').style.background='',200);},700);setTimeout(()=>{flyEl.style.display='none';advance();},900);}
function advance(){qInRound++;if(qInRound>=5)showRound();else loadQ();}
function playWin(){try{const ctx=new(window.AudioContext||window.webkitAudioContext)();const now=ctx.currentTime;const o1=ctx.createOscillator(),g1=ctx.createGain();o1.connect(g1);g1.connect(ctx.destination);o1.type='sine';o1.frequency.setValueAtTime(300,now);o1.frequency.exponentialRampToValueAtTime(1400,now+0.35);o1.frequency.exponentialRampToValueAtTime(900,now+0.65);g1.gain.setValueAtTime(0.25,now);g1.gain.exponentialRampToValueAtTime(0.01,now+0.8);o1.start(now);o1.stop(now+0.8);const o2=ctx.createOscillator(),g2=ctx.createGain();o2.connect(g2);g2.connect(ctx.destination);o2.type='triangle';o2.frequency.setValueAtTime(180,now+0.5);o2.frequency.exponentialRampToValueAtTime(70,now+0.9);g2.gain.setValueAtTime(0.4,now+0.5);g2.gain.exponentialRampToValueAtTime(0.01,now+1.0);o2.start(now+0.5);o2.stop(now+1.0);}catch(e){}}
function showRound(){if(round>=2){showGameOver();return;}playWin();const names=['第一輪','第二輪','第三輪'],emojis=['🎯','🔥','🏆'];document.getElementById('roundEmoji').textContent=emojis[round];document.getElementById('roundTitle').textContent=names[round]+'完成！';document.getElementById('roundDesc').textContent='繼續挑戰'+names[round+1]+'！';document.getElementById('roundModal').classList.add('show');}
function nextRound(){document.getElementById('roundModal').classList.remove('show');round++;qInRound=0;const names=['第一輪','第二輪','第三輪'];document.getElementById('roundLabel').textContent=names[round];for(let i=0;i<3;i++)document.getElementById('dot'+i).className='round-dot'+(i<round?' done':i===round?' active':'');loadQ();}
function showGameOver(){playWin();setTimeout(()=>playWin(),600);const pct=correct/15*100;document.getElementById('finalStars').textContent=pct>=90?'⭐⭐⭐':pct>=60?'⭐⭐':'⭐';document.getElementById('finalScore').textContent=score;document.getElementById('finalMsg').textContent=pct>=90?'全對！你是注音大師🏆':pct>=60?'答得很棒！繼續加油！':'再練習一次，你會進步的！';document.getElementById('gameOverModal').classList.add('show');}
function restartGame(){round=0;qInRound=0;correct=0;score=0;document.getElementById('correctCnt').textContent='0';document.getElementById('scoreCnt').textContent='0';document.getElementById('gameOverModal').classList.remove('show');document.getElementById('roundLabel').textContent='第一輪';for(let i=0;i<3;i++)document.getElementById('dot'+i).className='round-dot'+(i===0?' active':'');loadQ();}
loadQ();
</script>
</body>
</html>
