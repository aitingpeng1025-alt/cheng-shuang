<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>結帳 — Cheng Shuang</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{background:#FDF6EC;font-family:'Noto Sans TC',sans-serif;color:#3D1F0A;min-height:100vh;}
.topbar{background:#FDF6EC;padding:0.9rem 1.2rem;display:flex;align-items:center;gap:0.6rem;border-bottom:1px solid rgba(192,120,48,0.2);position:sticky;top:0;z-index:10;}
.back-btn{background:none;border:none;font-size:20px;cursor:pointer;color:#B8401A;}
.topbar-title{font-size:13px;font-weight:700;color:#3D1F0A;}
.container{max-width:480px;margin:0 auto;padding:1.2rem;}
.sec-title{font-size:13px;font-weight:700;color:#B8401A;letter-spacing:1px;margin-bottom:0.8rem;}
.product-card{background:#fff;border:1px solid #EDD8B0;border-radius:14px;padding:1.1rem 1.2rem;margin-bottom:0.8rem;display:flex;align-items:center;justify-content:space-between;gap:1rem;}
.product-info h3{font-size:14px;font-weight:700;color:#3D1F0A;}
.product-info p{font-size:12px;color:#A0622A;margin-top:0.2rem;}
.product-price{font-size:15px;font-weight:700;color:#B8401A;margin-top:0.3rem;}
.buy-btn{background:#B8401A;color:#fff;border:none;border-radius:50px;padding:0.55rem 1.1rem;font-size:13px;font-weight:700;font-family:'Noto Sans TC',sans-serif;cursor:pointer;text-decoration:none;white-space:nowrap;flex-shrink:0;display:inline-block;}
.buy-btn:active{background:#7A2510;}
.note{font-size:11px;color:#A0622A;text-align:center;line-height:1.8;margin-top:1.5rem;padding:1rem;background:#fff;border-radius:12px;border:1px solid #EDD8B0;}
</style>
</head>
<body>
<div class="topbar">
  <button class="back-btn" onclick="history.back()">‹</button>
  <span class="topbar-title">選擇商品結帳</span>
</div>
<div class="container">
  <p class="sec-title">▸ 點選商品前往付款</p>
  <div class="product-card">
    <div class="product-info">
      <h3>注音符號手寫板</h3>
      <p>含木製鉛筆 × 1、練習紙 × 1</p>
      <p class="product-price">$1,050</p>
    </div>
    <a class="buy-btn" href="https://p.ecpay.com.tw/0D7EB9E" target="_blank">前往付款 →</a>
  </div>
  <div class="product-card">
    <div class="product-info">
      <h3>注音符號拼音板（小款）</h3>
      <p>含字卡、海報、木質拼音板</p>
      <p class="product-price">$920</p>
    </div>
    <a class="buy-btn" href="https://p.ecpay.com.tw/568F7C5" target="_blank">前往付款 →</a>
  </div>
  <div class="product-card">
    <div class="product-info">
      <h3>注音符號拼音板（大款）</h3>
      <p>含字卡、海報、木質拼音板（大）</p>
      <p class="product-price">$1,180</p>
    </div>
    <a class="buy-btn" href="https://p.ecpay.com.tw/0FA4005" target="_blank">前往付款 →</a>
  </div>
  <p class="note">
    💳 支援信用卡、ATM 轉帳、超商代碼付款<br>
    🔒 付款由綠界科技處理，資料加密安全無虞<br>
    📦 付款完成後將以 Email 通知出貨資訊
  </p>
</div>
<script>
const p = new URLSearchParams(window.location.search).get('product');
if (p === 'write') window.location.href = 'https://p.ecpay.com.tw/0D7EB9E';
else if (p === 'pinyin_small') window.location.href = 'https://p.ecpay.com.tw/568F7C5';
else if (p === 'pinyin_large') window.location.href = 'https://p.ecpay.com.tw/0FA4005';
</script>
</body>
</html>
