<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>結帳 — Cheng Shuang</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{background:#FDF6EC;font-family:'Noto Sans TC',sans-serif;color:#3D1F0A;min-height:100vh;}
.topbar{background:#FDF6EC;padding:0.9rem 1.2rem;display:flex;align-items:center;gap:0.6rem;border-bottom:1px solid rgba(192,120,48,0.2);position:sticky;top:0;z-index:10;}
.back-btn{background:none;border:none;font-size:20px;cursor:pointer;color:#B8401A;}
.topbar-title{font-size:13px;font-weight:700;color:#3D1F0A;}
.container{max-width:480px;margin:0 auto;padding:1.2rem;}
.sec-title{font-size:13px;font-weight:700;color:#B8401A;letter-spacing:1px;margin-bottom:0.8rem;}
.product-card{background:#fff;border:2px solid #EDD8B0;border-radius:14px;padding:0.9rem 1rem;margin-bottom:0.8rem;cursor:pointer;transition:border 0.15s;}
.product-card.selected{border-color:#B8401A;background:#FFF5F0;}
.product-card h3{font-size:14px;font-weight:700;color:#3D1F0A;}
.product-card p{font-size:12px;color:#A0622A;margin-top:0.2rem;}
.product-price{font-size:15px;font-weight:700;color:#B8401A;margin-top:0.3rem;}
.ship-options{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:1rem;}
.ship-option{background:#fff;border:2px solid #EDD8B0;border-radius:12px;padding:0.8rem;cursor:pointer;transition:border 0.15s;text-align:center;}
.ship-option.selected{border-color:#B8401A;background:#FFF5F0;}
.ship-icon{font-size:22px;margin-bottom:0.3rem;}
.ship-name{font-size:12px;font-weight:700;color:#3D1F0A;}
.ship-fee{font-size:11px;color:#A0622A;margin-top:0.2rem;}
.ship-fee .free{color:#4CAF50;font-weight:700;}
.divider{height:1px;background:#C07830;opacity:0.2;margin:1rem 0;}
.summary{background:#fff;border:1px solid #EDD8B0;border-radius:12px;padding:1rem;margin-bottom:1.2rem;}
.summary-row{display:flex;justify-content:space-between;font-size:13px;margin-bottom:0.5rem;}
.summary-row.free-ship{color:#4CAF50;font-weight:700;}
.summary-row.total{font-weight:700;font-size:16px;color:#B8401A;border-top:1px solid #EDD8B0;padding-top:0.7rem;margin-top:0.3rem;}
.free-ship-badge{background:#E8F5E9;color:#4CAF50;border-radius:20px;padding:0.3rem 0.8rem;font-size:11px;font-weight:700;text-align:center;margin-bottom:0.8rem;}
.almost-free{background:#FFF8E1;color:#F57C00;border-radius:20px;padding:0.3rem 0.8rem;font-size:11px;text-align:center;margin-bottom:0.8rem;}
.checkout-btn{width:100%;background:#B8401A;color:#fff;border:none;border-radius:50px;padding:0.9rem;font-size:16px;font-weight:700;font-family:'Noto Sans TC',sans-serif;cursor:pointer;margin-bottom:0.8rem;}
.checkout-btn:active{background:#7A2510;}
.note{font-size:11px;color:#A0622A;text-align:center;line-height:1.8;}

/* 收件資料 */
.field{margin-bottom:0.8rem;}
.field label{display:block;font-size:12px;font-weight:700;color:#3D1F0A;margin-bottom:0.35rem;}
.field label .req{color:#B8401A;}
.field input{width:100%;background:#fff;border:2px solid #EDD8B0;border-radius:10px;padding:0.7rem 0.8rem;font-size:14px;font-family:'Noto Sans TC',sans-serif;color:#3D1F0A;}
.field input:focus{outline:none;border-color:#B8401A;}
.field .hint{font-size:10px;color:#A0622A;margin-top:0.3rem;}
.home-section{display:none;}
.home-section.show{display:block;}

/* 超商選門市 */
.cvs-section{display:none;background:#fff;border:1px solid #EDD8B0;border-radius:12px;padding:1rem;margin-bottom:1rem;}
.cvs-section.show{display:block;}
.cvs-type-options{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-bottom:0.8rem;}
.cvs-type-btn{background:#F0D0C0;color:#7A4A20;border:2px solid transparent;border-radius:8px;padding:0.5rem;font-size:12px;font-weight:700;font-family:'Noto Sans TC',sans-serif;cursor:pointer;text-align:center;}
.cvs-type-btn.selected{border-color:#B8401A;background:#FFF5F0;color:#B8401A;}
.select-cvs-btn{width:100%;background:#C07830;color:#fff;border:none;border-radius:50px;padding:0.65rem;font-size:13px;font-weight:700;font-family:'Noto Sans TC',sans-serif;cursor:pointer;margin-top:0.5rem;}
.cvs-result{background:#E8F5E9;border-radius:8px;padding:0.6rem 0.8rem;font-size:12px;color:#2E7D32;margin-top:0.6rem;display:none;line-height:1.7;}
.cvs-result.show{display:block;}
</style>
</head>
<body>
<div class="topbar">
  <button class="back-btn" type="button" onclick="history.back()">‹</button>
  <span class="topbar-title">結帳</span>
</div>

<form class="container" id="orderForm" method="POST" action="/.netlify/functions/create-order">
  <input type="hidden" name="productId" id="productId" value="write">
  <input type="hidden" name="shipType" id="shipType" value="home">
  <input type="hidden" name="storeId" id="storeId" value="">
  <input type="hidden" name="storeName" id="storeName" value="">

  <p class="sec-title">▸ 選擇商品</p>
  <div class="product-card selected" data-id="write" data-price="1050">
    <h3>注音符號手寫板</h3>
    <p>含木製鉛筆 × 1、練習紙 × 1</p>
    <p class="product-price">$1,050</p>
  </div>
  <div class="product-card" data-id="pinyin_small" data-price="920">
    <h3>注音符號拼音板（小款）</h3>
    <p>含字卡、海報、木質拼音板</p>
    <p class="product-price">$920</p>
  </div>
  <div class="product-card" data-id="pinyin_large" data-price="1180">
    <h3>注音符號拼音板（大款）</h3>
    <p>含字卡、海報、木質拼音板（大）</p>
    <p class="product-price">$1,180</p>
  </div>

  <div class="divider"></div>

  <p class="sec-title">▸ 配送方式</p>
  <div class="ship-options">
    <div class="ship-option selected" data-type="home" data-fee="120">
      <div class="ship-icon">🏠</div>
      <div class="ship-name">宅配到府</div>
      <div class="ship-fee" id="homeFee">運費 $120</div>
    </div>
    <div class="ship-option" data-type="cvs" data-fee="60">
      <div class="ship-icon">🏪</div>
      <div class="ship-name">超商取貨</div>
      <div class="ship-fee" id="cvsFee">運費 $60</div>
    </div>
  </div>

  <div class="cvs-section" id="cvsSection">
    <p style="font-size:12px;font-weight:700;color:#3D1F0A;margin-bottom:0.6rem;">選擇超商品牌</p>
    <div class="cvs-type-options">
      <button type="button" class="cvs-type-btn selected" data-cvs="FAMI">全家</button>
      <button type="button" class="cvs-type-btn" data-cvs="UNIMART">7-ELEVEN</button>
      <button type="button" class="cvs-type-btn" data-cvs="HILIFE">萊爾富</button>
    </div>
    <button type="button" class="select-cvs-btn" id="selectCvsBtn">🗺 選擇取貨門市</button>
    <div class="cvs-result" id="cvsResult"></div>
  </div>

  <div class="divider"></div>

  <p class="sec-title">▸ 收件資料</p>
  <div class="field">
    <label for="name">收件人姓名 <span class="req">*</span></label>
    <input type="text" id="name" name="name" maxlength="20" autocomplete="name" required>
  </div>
  <div class="field">
    <label for="phone">聯絡電話 <span class="req">*</span></label>
    <input type="tel" id="phone" name="phone" maxlength="20" autocomplete="tel" inputmode="tel" required>
  </div>
  <div class="home-section show" id="homeSection">
    <div class="field">
      <label for="address">收件地址 <span class="req">*</span></label>
      <input type="text" id="address" name="address" maxlength="50" autocomplete="street-address" required>
      <p class="hint">請填寫完整地址，含縣市與區</p>
    </div>
  </div>

  <div id="freeShipMsg"></div>
  <div class="divider"></div>

  <p class="sec-title">▸ 訂單摘要</p>
  <div class="summary">
    <div class="summary-row">
      <span id="summaryProduct">注音符號手寫板</span>
      <span id="summaryPrice">$1,050</span>
    </div>
    <div class="summary-row" id="shippingRow">
      <span>運費（宅配到府）</span>
      <span id="summaryShipping">$120</span>
    </div>
    <div class="summary-row total">
      <span>總計</span>
      <span id="summaryTotal">$1,170</span>
    </div>
  </div>

  <button class="checkout-btn" type="submit">前往付款 →</button>
  <p class="note">
    🔒 付款由綠界科技處理，可選信用卡、ATM 或超商代碼<br>
    📦 收件資料會隨訂單送出，付款完成即開始備貨
  </p>
</form>

<script>
const FREE_SHIP = 3600;
const ECPAY_MERCHANT_ID = '3350784';
const SHIP_NAMES = { home: '宅配到府', cvs: '超商取貨' };

let product = { id: 'write', name: '注音符號手寫板', price: 1050 };
let ship = { type: 'home', fee: 120 };
let cvsType = 'FAMI';

const $ = id => document.getElementById(id);

document.querySelectorAll('.product-card').forEach(card => {
  card.addEventListener('click', () => {
    document.querySelectorAll('.product-card').forEach(c => c.classList.remove('selected'));
    card.classList.add('selected');
    product = {
      id: card.dataset.id,
      name: card.querySelector('h3').textContent,
      price: Number(card.dataset.price),
    };
    $('productId').value = product.id;
    updateSummary();
  });
});

document.querySelectorAll('.ship-option').forEach(opt => {
  opt.addEventListener('click', () => {
    document.querySelectorAll('.ship-option').forEach(o => o.classList.remove('selected'));
    opt.classList.add('selected');
    ship = { type: opt.dataset.type, fee: Number(opt.dataset.fee) };
    $('shipType').value = ship.type;
    $('cvsSection').className = ship.type === 'cvs' ? 'cvs-section show' : 'cvs-section';
    $('homeSection').className = ship.type === 'home' ? 'home-section show' : 'home-section';
    $('address').required = ship.type === 'home';
    updateSummary();
  });
});

document.querySelectorAll('.cvs-type-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.cvs-type-btn').forEach(b => b.classList.remove('selected'));
    btn.classList.add('selected');
    cvsType = btn.dataset.cvs;
    // 換了超商品牌就要重新選門市
    $('storeId').value = '';
    $('storeName').value = '';
    $('cvsResult').className = 'cvs-result';
  });
});

// 開啟綠界電子地圖；選完門市由 cvs-reply function 用 postMessage 回傳
$('selectCvsBtn').addEventListener('click', () => {
  const win = window.open('', 'ecpayCvsMap', 'width=900,height=700');
  if (!win) {
    alert('請允許彈出視窗，才能開啟門市地圖');
    return;
  }
  const form = document.createElement('form');
  form.method = 'POST';
  form.action = 'https://logistics.ecpay.com.tw/Express/map';
  form.target = 'ecpayCvsMap';
  const fields = {
    MerchantID: ECPAY_MERCHANT_ID,
    LogisticsType: 'CVS',
    LogisticsSubType: cvsType,
    IsCollection: 'N',
    ServerReplyURL: window.location.origin + '/.netlify/functions/cvs-reply',
    Device: /Mobi|Android|iPhone/i.test(navigator.userAgent) ? '1' : '0',
  };
  Object.entries(fields).forEach(([k, v]) => {
    const input = document.createElement('input');
    input.type = 'hidden';
    input.name = k;
    input.value = v;
    form.appendChild(input);
  });
  document.body.appendChild(form);
  form.submit();
  document.body.removeChild(form);
});

window.addEventListener('message', event => {
  if (event.origin !== window.location.origin) return;
  if (!event.data || event.data.type !== 'ecpay-cvs-store') return;
  const store = event.data.store || {};
  if (!store.id || !store.name) return;
  $('storeId').value = store.id;
  $('storeName').value = store.name;
  const result = $('cvsResult');
  result.innerHTML = '✅ 已選擇門市：<strong>' + store.name + '</strong>'
    + (store.address ? '<br>' + store.address : '');
  result.className = 'cvs-result show';
});

function updateSummary() {
  const isFree = product.price >= FREE_SHIP;
  const actualFee = isFree ? 0 : ship.fee;
  const total = product.price + actualFee;

  $('summaryProduct').textContent = product.name;
  $('summaryPrice').textContent = '$' + product.price.toLocaleString();
  $('summaryTotal').textContent = '$' + total.toLocaleString();

  const shipRow = $('shippingRow');
  shipRow.querySelector('span').textContent = '運費（' + SHIP_NAMES[ship.type] + '）';
  shipRow.className = isFree ? 'summary-row free-ship' : 'summary-row';
  $('summaryShipping').textContent = isFree ? '免運 🎉' : '$' + actualFee;

  if (isFree) {
    $('freeShipMsg').innerHTML = '<div class="free-ship-badge">🎉 恭喜！本訂單已享免運優惠</div>';
    $('homeFee').innerHTML = '<span class="free">免運</span>';
    $('cvsFee').innerHTML = '<span class="free">免運</span>';
  } else {
    const diff = FREE_SHIP - product.price;
    $('freeShipMsg').innerHTML = '<div class="almost-free">再購 $' + diff.toLocaleString() + ' 即可享免運優惠（滿 $3,600 免運）</div>';
    $('homeFee').textContent = '運費 $120';
    $('cvsFee').textContent = '運費 $60';
  }
}

$('orderForm').addEventListener('submit', event => {
  if (ship.type === 'cvs' && !$('storeId').value) {
    event.preventDefault();
    alert('請先選擇取貨門市！');
  }
});

updateSummary();

const preset = new URLSearchParams(window.location.search).get('product');
const presetCard = document.querySelector('.product-card[data-id="' + preset + '"]');
if (presetCard) presetCard.click();
</script>
</body>
</html>
