<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>結帳 — Cheng Shuang</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{background:#FDF6EC;font-family:'Noto Sans TC',sans-serif;color:#3D1F0A;min-height:100vh;}
.topbar{background:#FDF6EC;padding:0.9rem 1.2rem;display:flex;align-items:center;gap:0.6rem;border-bottom:1px solid rgba(192,120,48,0.2);position:sticky;top:0;z-index:10;}
.back-btn{background:none;border:none;font-size:20px;cursor:pointer;color:#B8401A;}
.topbar-title{font-size:13px;font-weight:700;color:#3D1F0A;}
.container{max-width:480px;margin:0 auto;padding:1.2rem;}
.sec-title{font-size:13px;font-weight:700;color:#B8401A;letter-spacing:1px;margin-bottom:0.8rem;}
.product-card{background:#fff;border:2px solid #EDD8B0;border-radius:14px;padding:0.9rem 1rem;margin-bottom:0.8rem;cursor:pointer;transition:border 0.15s;}
.product-card.selected{border-color:#B8401A;background:#FFF5F0;}
.product-card h3{font-size:14px;font-weight:700;color:#3D1F0A;}
.product-card p{font-size:12px;color:#A0622A;margin-top:0.2rem;}
.product-price{font-size:15px;font-weight:700;color:#B8401A;margin-top:0.3rem;}
.ship-options{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:1rem;}
.ship-option{background:#fff;border:2px solid #EDD8B0;border-radius:12px;padding:0.8rem;cursor:pointer;transition:border 0.15s;text-align:center;}
.ship-option.selected{border-color:#B8401A;background:#FFF5F0;}
.ship-icon{font-size:22px;margin-bottom:0.3rem;}
.ship-name{font-size:12px;font-weight:700;color:#3D1F0A;}
.ship-fee{font-size:11px;color:#A0622A;margin-top:0.2rem;}
.ship-fee.free{color:#4CAF50;font-weight:700;}
.divider{height:1px;background:#C07830;opacity:0.2;margin:1rem 0;}
.summary{background:#fff;border:1px solid #EDD8B0;border-radius:12px;padding:1rem;margin-bottom:1.2rem;}
.summary-row{display:flex;justify-content:space-between;font-size:13px;margin-bottom:0.5rem;}
.summary-row.free-ship{color:#4CAF50;font-weight:700;}
.summary-row.total{font-weight:700;font-size:16px;color:#B8401A;border-top:1px solid #EDD8B0;padding-top:0.7rem;margin-top:0.3rem;}
.free-ship-badge{background:#E8F5E9;color:#4CAF50;border-radius:20px;padding:0.3rem 0.8rem;font-size:11px;font-weight:700;text-align:center;margin-bottom:0.8rem;}
.almost-free{background:#FFF8E1;color:#F57C00;border-radius:20px;padding:0.3rem 0.8rem;font-size:11px;text-align:center;margin-bottom:0.8rem;}
.checkout-btn{width:100%;background:#B8401A;color:#fff;border:none;border-radius:50px;padding:0.9rem;font-size:16px;font-weight:700;font-family:'Noto Sans TC',sans-serif;cursor:pointer;margin-bottom:0.8rem;}
.checkout-btn:disabled{background:#ccc;cursor:not-allowed;}
.checkout-btn:active{background:#7A2510;}
.note{font-size:11px;color:#A0622A;text-align:center;line-height:1.8;}

/* 超商選門市區塊 */
.cvs-section{display:none;background:#fff;border:1px solid #EDD8B0;border-radius:12px;padding:1rem;margin-bottom:1rem;}
.cvs-section.show{display:block;}
.cvs-type-options{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-bottom:0.8rem;}
.cvs-type-btn{background:#F0D0C0;color:#7A4A20;border:2px solid transparent;border-radius:8px;padding:0.5rem;font-size:12px;font-weight:700;font-family:'Noto Sans TC',sans-serif;cursor:pointer;text-align:center;}
.cvs-type-btn.selected{border-color:#B8401A;background:#FFF5F0;color:#B8401A;}
.select-cvs-btn{width:100%;background:#C07830;color:#fff;border:none;border-radius:50px;padding:0.65rem;font-size:13px;font-weight:700;font-family:'Noto Sans TC',sans-serif;cursor:pointer;margin-top:0.5rem;}
.cvs-result{background:#E8F5E9;border-radius:8px;padding:0.6rem 0.8rem;font-size:12px;color:#2E7D32;margin-top:0.6rem;display:none;}
.cvs-result.show{display:block;}
</style>
</head>
<body>
<div class="topbar">
  <button class="back-btn" onclick="history.back()">‹</button>
  <span class="topbar-title">結帳</span>
</div>
<div class="container">

  <p class="sec-title">▸ 選擇商品</p>
  <div class="product-card selected" onclick="selectProduct(this,'注音符號手寫板',1050,'https://p.ecpay.com.tw/0D7EB9E')">
    <h3>注音符號手寫板</h3>
    <p>含木製鉛筆 × 1、練習紙 × 1</p>
    <p class="product-price">$1,050</p>
  </div>
  <div class="product-card" onclick="selectProduct(this,'注音符號拼音板（小款）',920,'https://p.ecpay.com.tw/568F7C5')">
    <h3>注音符號拼音板（小款）</h3>
    <p>含字卡、海報、木質拼音板</p>
    <p class="product-price">$920</p>
  </div>
  <div class="product-card" onclick="selectProduct(this,'注音符號拼音板（大款）',1180,'https://p.ecpay.com.tw/0FA4005')">
    <h3>注音符號拼音板（大款）</h3>
    <p>含字卡、海報、木質拼音板（大）</p>
    <p class="product-price">$1,180</p>
  </div>

  <div class="divider"></div>

  <p class="sec-title">▸ 配送方式</p>
  <div class="ship-options">
    <div class="ship-option selected" onclick="selectShip(this,'home',120)">
      <div class="ship-icon">🏠</div>
      <div class="ship-name">宅配到府</div>
      <div class="ship-fee" id="homeFee">運費 $120</div>
    </div>
    <div class="ship-option" onclick="selectShip(this,'cvs',60)">
      <div class="ship-icon">🏪</div>
      <div class="ship-name">超商取貨</div>
      <div class="ship-fee" id="cvsFee">運費 $60</div>
    </div>
  </div>

  <!-- 超商選門市 -->
  <div class="cvs-section" id="cvsSection">
    <p style="font-size:12px;font-weight:700;color:#3D1F0A;margin-bottom:0.6rem;">選擇超商品牌</p>
    <div class="cvs-type-options">
      <button class="cvs-type-btn selected" onclick="selectCvsType(this,'FAMI')">全家</button>
      <button class="cvs-type-btn" onclick="selectCvsType(this,'UNIMART')">7-ELEVEN</button>
      <button class="cvs-type-btn" onclick="selectCvsType(this,'HILIFE')">萊爾富</button>
    </div>
    <button class="select-cvs-btn" onclick="openCvsMap()">🗺 選擇取貨門市</button>
    <div class="cvs-result" id="cvsResult">
      ✅ 已選擇門市：<span id="cvsStoreName"></span>
    </div>
  </div>

  <div id="freeShipMsg"></div>
  <div class="divider"></div>

  <p class="sec-title">▸ 訂單摘要</p>
  <div class="summary">
    <div class="summary-row">
      <span id="summaryProduct">注音符號手寫板</span>
      <span id="summaryPrice">$1,050</span>
    </div>
    <div class="summary-row" id="shippingRow">
      <span>運費（宅配到府）</span>
      <span id="summaryShipping">$120</span>
    </div>
    <div class="summary-row total">
      <span>總計</span>
      <span id="summaryTotal">$1,170</span>
    </div>
  </div>

  <button class="checkout-btn" id="checkoutBtn" onclick="goCheckout()">前往付款 →</button>
  <p class="note">
    🔒 付款由綠界科技處理，資料加密安全無虞<br>
    📦 付款完成後將以 Email 通知出貨資訊
  </p>
</div>

<script>
const FREE_SHIP = 3600;
let product = {name:'注音符號手寫板', price:1050, url:'https://p.ecpay.com.tw/0D7EB9E'};
let ship = {type:'home', fee:120, name:'宅配到府'};
let cvsType = 'FAMI';
let cvsStoreSelected = false;

function selectProduct(el, name, price, url) {
  document.querySelectorAll('.product-card').forEach(c => c.classList.remove('selected'));
  el.classList.add('selected');
  product = {name, price, url};
  updateSummary();
}

function selectShip(el, type, fee) {
  document.querySelectorAll('.ship-option').forEach(s => s.classList.remove('selected'));
  el.classList.add('selected');
  const name = type === 'home' ? '宅配到府' : '超商取貨';
  ship = {type, fee, name};
  document.getElementById('cvsSection').className = type === 'cvs' ? 'cvs-section show' : 'cvs-section';
  updateSummary();
}

function selectCvsType(el, type) {
  document.querySelectorAll('.cvs-type-btn').forEach(b => b.classList.remove('selected'));
  el.classList.add('selected');
  cvsType = type;
}

async function openCvsMap() {
  const btn = document.querySelector('.select-cvs-btn');
  btn.textContent = '⏳ 開啟地圖中...';
  btn.disabled = true;
  try {
    const res = await fetch('/.netlify/functions/select-cvs', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ cvsType })
    });
    const data = await res.json();
    if (data.formHtml) {
      // 開啟新視窗讓顧客選門市
      const w = window.open('', '_blank', 'width=900,height=700');
      w.document.write(data.formHtml);
      // 模擬選好門市後回傳（實際需要綠界回調）
      setTimeout(() => {
        document.getElementById('cvsStoreName').textContent = '已選擇（請重新整理確認）';
        document.getElementById('cvsResult').className = 'cvs-result show';
        cvsStoreSelected = true;
      }, 3000);
    }
  } catch(err) {
    alert('開啟門市地圖失敗，請稍後再試');
  }
  btn.textContent = '🗺 選擇取貨門市';
  btn.disabled = false;
}

function updateSummary() {
  const isFree = product.price >= FREE_SHIP;
  const actualFee = isFree ? 0 : ship.fee;
  const total = product.price + actualFee;
  document.getElementById('summaryProduct').textContent = product.name;
  document.getElementById('summaryPrice').textContent = '$' + product.price.toLocaleString();
  document.getElementById('summaryTotal').textContent = '$' + total.toLocaleString();
  const shipRow = document.getElementById('shippingRow');
  const shipSpan = document.getElementById('summaryShipping');
  if (isFree) {
    shipRow.className = 'summary-row free-ship';
    shipRow.querySelector('span').textContent = '運費（' + ship.name + '）';
    shipSpan.textContent = '免運 🎉';
    document.getElementById('freeShipMsg').innerHTML = '<div class="free-ship-badge">🎉 恭喜！本訂單已享免運優惠</div>';
    document.getElementById('homeFee').innerHTML = '<span class="free">免運</span>';
    document.getElementById('cvsFee').innerHTML = '<span class="free">免運</span>';
  } else {
    shipRow.className = 'summary-row';
    shipRow.querySelector('span').textContent = '運費（' + ship.name + '）';
    shipSpan.textContent = '$' + actualFee;
    const diff = FREE_SHIP - product.price;
    document.getElementById('freeShipMsg').innerHTML = '<div class="almost-free">再購 $' + diff.toLocaleString() + ' 即可享免運優惠（滿 $3,600 免運）</div>';
    document.getElementById('homeFee').className = 'ship-fee';
    document.getElementById('homeFee').textContent = '運費 $120';
    document.getElementById('cvsFee').className = 'ship-fee';
    document.getElementById('cvsFee').textContent = '運費 $60';
  }
}

function goCheckout() {
  if (ship.type === 'cvs' && !cvsStoreSelected) {
    alert('請先選擇取貨門市！');
    return;
  }
  window.location.href = product.url;
}

updateSummary();

const p = new URLSearchParams(window.location.search).get('product');
if (p === 'write') document.querySelectorAll('.product-card')[0].click();
else if (p === 'pinyin_small') document.querySelectorAll('.product-card')[1].click();
else if (p === 'pinyin_large') document.querySelectorAll('.product-card')[2].click();
</script>
</body>
</html>
